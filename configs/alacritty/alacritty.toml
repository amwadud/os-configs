[font]
size = 9.5                    # Set the font size to 12.0

[font.normal]
family = "FiraCode Nerd Font"           # Set the normal font to Fira Code
style = "Regular"              # Use the Regular style of Fira Code

[font.bold]
family = "FiraCode Nerd Font"           # Set the bold font to Fira Code
style = "Bold"                 # Use the Bold style of Fira Code

[font.italic]
family = "FiraCode Nerd Font"           # Set the italic font to Fira Code
style = "Italic"               # Use the Italic style of Fira Code

[font.bold_italic]
family = "FiraCode Nerd Font"           # Set the bold italic font to Fira Code
style = "Bold Italic"          # Use the Bold Italic style of Fira Code

[window]
# Horizontal padding (left + right)
padding.x = 15
padding.y = 15

[colors.primary]
foreground = "#ebdbb2"
background = "#32302f"

[colors.cursor]
text = "#32302f"
cursor = "#ebdbb2"

[colors.selection]
text = "#32302f"
background = "#ebdbb2"

[colors.normal]
black = "#32302f"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
